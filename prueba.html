<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnóstico del suelo - Paso 1</title>
  <!-- Google Fonts: Newsreader e Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Newsreader:wght@600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-primary-dark: #0F5238;
      --color-badge-bg: #D7E5BB;
      --color-badge-text: #5A6745;
      --color-text-body: #404943;
      --color-box-bg: #F5F3EE;
      --color-border: rgba(191, 201, 193, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: var(--color-text-body);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Frame 18 / Main */
    .main-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
      max-width: 1280px;
      padding: 40px 20px;
    }

    /* Container */
    .content-container {
      width: 100%;
      max-width: 896px;
      margin: 0 auto;
    }

    /* Context Info */
    .context-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      max-width: 400px;
    }

    /* Badge: Paso 1 de 4 */
    .step-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 16px;
      gap: 8px;
      background: var(--color-badge-bg);
      border-radius: 9999px;
      height: 28px;
    }

    .step-badge-icon {
      width: 12px;
      height: 12px;
      background: var(--color-badge-text);
      border-radius: 50%;
    }

    .step-badge-text {
      font-weight: 600;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: 0.7px;
      color: var(--color-badge-text);
      text-transform: uppercase;
    }

    /* Frame 19: Headings & Description */
    .header-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .title-main {
      font-family: 'Newsreader', serif;
      font-weight: 600;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.96px;
      color: var(--color-primary-dark);
    }

    .title-sub {
      font-weight: 600;
      font-size: 18px;
      line-height: 1.4;
      letter-spacing: -0.5px;
      color: var(--color-primary-dark);
    }

    .description-text {
      font-weight: 400;
      font-size: 18px;
      line-height: 28px;
      color: var(--color-text-body);
      padding-bottom: 8px;
    }

    /* Background+Border (Caja informativa o formulario) */
    .info-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 16px;
      gap: 12px;
      width: 100%;
      min-height: 66px;
      background: var(--color-box-bg);
      border: 1px solid var(--color-border);
      border-radius: 12px; /* Completado desde el recorte de código */
    }
  </style>
</head>
<body>

  <main class="main-section">
    <div class="content-container">
      
      <!-- Context Info -->
      <section class="context-info">
        
        <!-- Background (Píldora / Badge) -->
        <div class="step-badge">
          <span class="step-badge-icon" aria-hidden="true"></span>
          <span class="step-badge-text">Paso 1 de 4</span>
        </div>

        <!-- Frame 19 -->
        <div class="header-group">
          <h1 class="title-main">Diagnóstico del suelo</h1>
          <h2 class="title-sub">Ubicación y superficie</h2>
          <p class="description-text">
            Comencemos con lo básico. Para ofrecerte un plan de siembra, riego y recomendaciones de plantas debemos conocer las condiciones de tu suelo.
          </p>
        </div>

        <!-- Background+Border -->
        <div class="info-card">
          <!-- Espacio para el contenido o input de la tarjeta -->
        </div>

      </section>

    </div>
  </main>

</body>
</html>
